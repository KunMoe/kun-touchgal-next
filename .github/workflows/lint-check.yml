name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # enable pnpm
      - name: Use Latest Corepack
        run: |
          echo "Before: corepack version => $(corepack --version || echo 'not installed')"
          npm install -g corepack@latest
          echo "After : corepack version => $(corepack --version)"
          corepack enable
          pnpm --version

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      # the postinstall hook runs `prisma generate`, which reads KUN_DATABASE_URL
      - name: Copy .env.example to .env
        run: cp .env.example .env

      - name: Install dependencies
        run: pnpm install

      - name: Generate prisma client
        run: pnpm run prisma:generate

      - name: Run ESLint
        run: pnpm run lint

      - name: Run Type Checking
        run: pnpm run typecheck

      - name: Run Unit Tests
        run: pnpm run test

  # Lua 脚本 (尝试预算的原子预留、窗口、结算) 在真 Redis 上的语义。其余测试都 mock 了
  # lib/redis, 证明不了脚本本身; 这组用例只在设了 KUN_REDIS_CONTRACT_URL 时运行
  redis-contract:
    runs-on: ubuntu-latest

    services:
      redis:
        # 与生产同主次版本
        image: redis:8.0-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      KUN_REDIS_CONTRACT_URL: redis://127.0.0.1:56379

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 启用 Corepack
        run: |
          npm install -g corepack@latest
          corepack enable

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      # postinstall 钩子会执行 prisma generate, 它要读 .env
      - name: 复制 .env.example 为 .env
        run: cp .env.example .env

      - name: 安装依赖
        run: pnpm install

      - name: 真 Redis 契约用例
        run: pnpm exec vitest run redis.test

  # 从空库回放 db/migrations。改了 prisma/schema 没写迁移、改了迁移没刷新快照, 都在这里失败
  db-replay:
    runs-on: ubuntu-latest

    services:
      postgres:
        # 主版本须与生产一致 (以生产上 `pnpm db:inspect` 的结果为准): 快照比对的
        # pg_get_*def 输出可能随主版本变化
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kun_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      KUN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kun_ci?schema=public
      # db:snapshot 回放前会清空这个库, 用服务自带的 postgres 库即可
      KUN_DB_SCRATCH_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 启用 Corepack
        run: |
          npm install -g corepack@latest
          corepack enable

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      # postinstall 钩子会执行 prisma generate, 它要读 .env
      - name: 复制 .env.example 为 .env
        run: cp .env.example .env

      - name: 安装依赖
        run: pnpm install

      # 设了 KUN_DB_SCRATCH_URL 才会运行的那组用例: 回滚、锁重试、INVALID 索引清理、回放库保护
      - name: 执行器的实库用例
        run: pnpm exec vitest run scripts/db

      - name: 在空库上执行全部迁移
        run: pnpm run db:migrate

      - name: 核对对象快照是否最新
        run: pnpm run db:snapshot --check

      - name: 对照快照与 Prisma schema 校验
        run: pnpm run db:verify --prisma

      # 设了 KUN_DB_CONTRACT_URL 才会运行的那组用例: 应用层的条件更新、冷却与并发在真库上的行为。
      # 用例要求 user 表为空, 跑完删掉自己建的行; 每个文件的入口都核对这一点, 所以逐个文件跑
      - name: 应用层的实库用例
        env:
          KUN_DB_CONTRACT_URL: postgresql://postgres:postgres@127.0.0.1:5432/kun_ci?schema=public
        run: >-
          pnpm exec vitest run --no-file-parallelism
          server/auth/__tests__/emailChange.db.test.ts
          server/auth/__tests__/securityEvents.db.test.ts
          server/storage/__tests__/s3Outbox.db.test.ts
          server/search/__tests__/sync.db.test.ts
          server/account/__tests__/deleteAccount.db.test.ts
          server/db/__tests__/tx.db.test.ts
          app/api/edit/__tests__/manualTag.db.test.ts
          app/api/edit/__tests__/update.db.test.ts
          prisma/__tests__/pgErrorFixtures.db.test.ts
          app/api/user/status/check-in/__tests__/route.db.test.ts
          app/api/patch/favorite/__tests__/route.db.test.ts
          app/api/message/conversation/__tests__/service.db.test.ts
          server/mail/__tests__/campaign.db.test.ts
          server/identity/__tests__/userIdentifier.db.test.ts
