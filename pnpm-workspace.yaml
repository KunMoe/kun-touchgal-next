publicHoistPattern:
  - '*@heroui/*'

enablePrePostScripts: true

auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 深层嵌套栈溢出：上游无修复版（维护者否认该问题），仅经 micromatch 被 globby / eslint / stylelint
    # 以仓库自有的静态 glob 调用，不接触外部输入。braces 发布修复版后删除此条并加 override
    - GHSA-vfj7-8cjw-p6xm

overrides:
  hono: '>=4.12.27'
  '@hono/node-server': '>=2.0.5'
  effect: '>=3.20.0'
  'eslint>ajv': '6.14.0'
  '@eslint/eslintrc>ajv': '6.14.0'
  'table>ajv': '8.18.0'
  fast-uri: '>=3.1.8 <4'
  fast-xml-parser: '>=5.7.0'
  postcss: '>=8.5.18'
  fast-xml-builder: '>=1.1.7'
  '@rvf/set-get': '>=7.0.2'
  jws: '3.2.3'
  dompurify: '>=3.4.16'
  tar: '>=7.5.21'
  undici: '>=8.10.2 <9'
  form-data: '>=4.0.6'
  valibot: '>=1.4.2'
  sharp: '>=0.35.5'
  colord: '>=2.9.4 <3'
  mysql2: '>=3.23.1 <4'
  'gray-matter>js-yaml': '>=3.15.2 <4'
  # js-yaml@3 只在 bin/js-yaml.js 里用 argparse，库入口不加载；剥掉它连带去掉无修复版的 sprintf-js（GHSA-hp3w-g68c-fv3c）
  'js-yaml@3>argparse': '-'
  '@eslint/eslintrc>js-yaml': '>=4.3.2 <5'
  'cosmiconfig>js-yaml': '>=4.3.2 <5'
  defu: '>=6.1.5'
  mdast-util-to-hast: '>=13.2.1'
  yaml: '>=2.8.3'
  lodash: '4.18.1'
  lodash-es: '4.18.1'
  'eslint>minimatch': '3.1.5'
  'eslint-plugin-import>minimatch': '3.1.5'
  'eslint-plugin-jsx-a11y>minimatch': '3.1.5'
  'eslint-plugin-react>minimatch': '3.1.5'
  '@typescript-eslint/typescript-estree>minimatch': '9.0.9'
  'minimatch@3>brace-expansion': '1.1.21'
  'brace-expansion@2': '>=2.1.7 <3'
  'brace-expansion@5': '>=5.0.12 <6'
  find-my-way: '>=9.7.0'
  'nanoid@<3.3.18': '>=3.3.18 <4'
  deepmerge-ts: '>=8.0.0'
  '@heroui/theme>tailwind-merge': '^3.7.0'
  'tailwind-variants>tailwind-merge': '^3.7.0'
  follow-redirects: '>=1.16.1 <2'
  vue: '>=3.5.42 <4'
  katex: '>=0.18.2 <0.19'
  # prosemirror-model 1.25.12 起在 NodeType.create 时校验 attrs；milkdown 7.22.2 给无标题图片传 title=null，解析时整张图
  # 被丢弃（上游 7.22.3 #2478 修复）。prosemirror-view 1.42.5 起要求 model ^1.25.12，故两者同时封顶；milkdown >=7.22.3 后去掉上界
  prosemirror-model: '>=1.25.8 <1.25.12'
  prosemirror-view: '>=1.42.3 <1.42.5'
  source-map-js: '>=1.2.2 <2'
  # react-aria 家族钉回 HeroUI 2.8.1 发布时（2025-07-15）的版本：caret 解析到单包壳会让同一模块出现两份实例，
  # FocusScope / OverlayContext 等全局状态随之分裂（嵌套菜单被父菜单误判失焦关闭）。升级 HeroUI 时整段删除重算
  '@react-aria/button': '3.13.3'
  '@react-aria/calendar': '3.8.3'
  '@react-aria/checkbox': '3.15.7'
  '@react-aria/dialog': '3.5.27'
  '@react-aria/focus': '3.20.5'
  '@react-aria/form': '3.0.18'
  '@react-aria/grid': '3.14.2'
  '@react-aria/i18n': '3.12.10'
  '@react-aria/interactions': '3.25.3'
  '@react-aria/label': '3.7.19'
  '@react-aria/landmark': '3.0.4'
  '@react-aria/link': '3.8.3'
  '@react-aria/listbox': '3.14.6'
  '@react-aria/live-announcer': '3.4.3'
  '@react-aria/menu': '3.18.5'
  '@react-aria/overlays': '3.27.3'
  '@react-aria/selection': '3.24.3'
  '@react-aria/slider': '3.7.21'
  '@react-aria/spinbutton': '3.6.16'
  '@react-aria/ssr': '3.9.9'
  '@react-aria/switch': '3.7.5'
  '@react-aria/tabs': '3.10.5'
  '@react-aria/textfield': '3.17.5'
  '@react-aria/toggle': '3.11.5'
  '@react-aria/utils': '3.29.1'
  '@react-stately/calendar': '3.8.2'
  '@react-stately/checkbox': '3.6.15'
  '@react-stately/collections': '3.12.5'
  '@react-stately/flags': '3.1.2'
  '@react-stately/form': '3.1.5'
  '@react-stately/grid': '3.11.3'
  '@react-stately/list': '3.12.3'
  '@react-stately/overlays': '3.6.17'
  '@react-stately/select': '3.6.14'
  '@react-stately/selection': '3.20.3'
  '@react-stately/slider': '3.6.5'
  '@react-stately/tabs': '3.8.3'
  '@react-stately/toggle': '3.8.5'
  '@react-stately/tree': '3.9.0'
  '@react-stately/utils': '3.10.7'
  '@react-types/button': '3.12.2'
  '@react-types/calendar': '3.7.2'
  '@react-types/checkbox': '3.9.5'
  '@react-types/dialog': '3.5.19'
  '@react-types/link': '3.6.2'
  '@react-types/listbox': '3.7.1'
  '@react-types/overlays': '3.8.16'
  '@react-types/select': '3.9.13'
  '@react-types/shared': '3.30.0'
  '@react-types/slider': '3.7.12'
  '@react-types/switch': '3.5.12'
  '@react-types/tabs': '3.3.16'

allowBuilds:
  '@heroui/shared-utils': true
  '@prisma/client': true
  '@prisma/engines': true
  '@tailwindcss/oxide': true
  bcrypt: true
  core-js: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

patchedDependencies:
  '@heroui/tabs@2.2.20': patches/@heroui__tabs@2.2.20.patch
  '@react-aria/i18n@3.12.10': patches/@react-aria__i18n@3.12.10.patch
  cap-widget@0.1.58: patches/cap-widget@0.1.58.patch
  next@16.3.8: patches/next@16.3.8.patch
