publicHoistPattern:
  - '*@heroui/*'

enablePrePostScripts: true

overrides:
  immutable: '>=5.1.8'
  hono: '>=4.12.27'
  '@hono/node-server': '>=2.0.5'
  effect: '>=3.20.0'
  'eslint>ajv': '6.14.0'
  '@eslint/eslintrc>ajv': '6.14.0'
  'table>ajv': '8.18.0'
  fast-uri: '>=3.1.6 <4'
  fast-xml-parser: '>=5.7.0'
  postcss: '>=8.5.18'
  fast-xml-builder: '>=1.1.7'
  '@rvf/set-get': '>=7.0.2'
  jws: '3.2.3'
  dompurify: '>=3.4.12'
  tar: '>=7.5.21'
  undici: '>=7.28.0 <8'
  form-data: '>=4.0.6'
  valibot: '>=1.4.2'
  sharp: '>=0.35.4'
  colord: '>=2.9.4 <3'
  mysql2: '>=3.23.1 <4'
  'gray-matter>js-yaml': '>=3.15.2 <4'
  '@eslint/eslintrc>js-yaml': '>=4.3.2 <5'
  'cosmiconfig>js-yaml': '>=4.3.2 <5'
  defu: '>=6.1.5'
  mdast-util-to-hast: '>=13.2.1'
  yaml: '>=2.8.3'
  lodash: '4.18.1'
  lodash-es: '4.18.1'
  'eslint>minimatch': '3.1.5'
  'eslint-plugin-import>minimatch': '3.1.5'
  'eslint-plugin-jsx-a11y>minimatch': '3.1.5'
  'eslint-plugin-react>minimatch': '3.1.5'
  '@typescript-eslint/typescript-estree>minimatch': '9.0.9'
  'minimatch@3>brace-expansion': '1.1.18'
  find-my-way: '>=9.7.0'
  'nanoid@<3.3.18': '>=3.3.18 <4'
  deepmerge-ts: '>=8.0.0'

allowBuilds:
  '@heroui/shared-utils': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@tailwindcss/oxide': true
  bcrypt: true
  core-js: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

patchedDependencies:
  cap-widget@0.1.56: patches/cap-widget@0.1.56.patch

minimumReleaseAgeExclude:
  - lucide-react@1.28.0
